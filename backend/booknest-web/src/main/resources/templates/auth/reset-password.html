<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Reset Password — BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-header { background: linear-gradient(135deg, #1a237e, #283593); border-radius: 16px 16px 0 0; padding: 24px; text-align: center; }
        .btn-success-c { background:#2e7d32;border-color:#2e7d32;color:#fff; }
        .btn-success-c:hover { background:#1b5e20;border-color:#1b5e20;color:#fff; }
        .form-control:focus { border-color:#1a237e;box-shadow:0 0 0 0.2rem rgba(26,35,126,.25); }
        .bar { height:6px;border-radius:3px;background:#e0e0e0;transition:all .3s; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;padding:24px 0;">
  <div class="card" style="width:420px;">
    <div class="brand-header">
      <h1 style="color:#fff;margin:0;font-size:26px;">📚 BookNest</h1>
      <p style="color:rgba(255,255,255,0.8);margin:6px 0 0;font-size:13px;">New Password Set Karein</p>
    </div>
    <div class="card-body p-4">
      <span style="background:#e8eaf6;color:#1a237e;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600;">Step 3 of 3</span>
      <h5 class="mt-3 mb-3" style="color:#1a237e;">Naya Password</h5>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
      <form th:action="@{/auth/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="email" th:value="${email}"/>
        <input type="hidden" name="otp"   th:value="${otp}"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Naya Password</label>
          <input type="password" name="newPassword" id="np" class="form-control"
                 placeholder="Minimum 6 characters" minlength="6" required autofocus
                 oninput="chkStr(this.value)"/>
          <div class="bar mt-2" id="bar"></div>
          <div id="stxt" style="font-size:12px;color:#666;margin-top:4px;"></div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password Confirm Karein</label>
          <input type="password" name="confirmPassword" id="cp" class="form-control"
                 placeholder="Dobara dalein" minlength="6" required oninput="chkMatch()"/>
          <div id="mtxt" style="font-size:12px;margin-top:4px;"></div>
        </div>
        <button type="submit" id="sbtn" class="btn btn-success-c w-100 py-2 fw-semibold">✅ Password Reset Karein</button>
      </form>
      <hr class="my-3"/>
      <p class="text-center mb-0" style="font-size:14px;">
        <a th:href="@{/auth/login}" style="color:#1a237e;">← Wapas Login par jayein</a>
      </p>
    </div>
  </div>
</div>
<script>
  function chkStr(v) {
    const b = document.getElementById('bar'), t = document.getElementById('stxt');
    b.style.background = '#e0e0e0'; b.style.width = '100%';
    if (!v) { t.textContent=''; return; }
    if (v.length < 6)       { b.style.background='#ef5350'; b.style.width='33%'; t.textContent='Bahut chhota'; t.style.color='#ef5350'; }
    else if (v.length < 10) { b.style.background='#ff9800'; b.style.width='66%'; t.textContent='Theek hai';   t.style.color='#ff9800'; }
    else                    { b.style.background='#4caf50'; t.textContent='Strong!';  t.style.color='#4caf50'; }
  }
  function chkMatch() {
    const p1=document.getElementById('np').value, p2=document.getElementById('cp').value;
    const m=document.getElementById('mtxt'), b=document.getElementById('sbtn');
    if (!p2) { m.textContent=''; return; }
    if (p1===p2) { m.textContent='✅ Match'; m.style.color='#4caf50'; b.disabled=false; }
    else          { m.textContent='❌ Match nahi'; m.style.color='#ef5350'; b.disabled=true; }
  }
</script>
</body>
</html>
