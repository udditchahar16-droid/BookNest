<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Verify OTP — BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-header { background: linear-gradient(135deg, #1a237e, #283593); border-radius: 16px 16px 0 0; padding: 24px; text-align: center; }
        .btn-primary { background: #1a237e; border-color: #1a237e; }
        .otp-input { text-align:center;font-size:28px;font-weight:bold;letter-spacing:12px;color:#1a237e; }
        .otp-input:focus { border-color:#1a237e;box-shadow:0 0 0 0.2rem rgba(26,35,126,.25); }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;padding:24px 0;">
  <div class="card" style="width:420px;">
    <div class="brand-header">
      <h1 style="color:#fff;margin:0;font-size:26px;">📚 BookNest</h1>
      <p style="color:rgba(255,255,255,0.8);margin:6px 0 0;font-size:13px;">OTP Verification</p>
    </div>
    <div class="card-body p-4">
      <span style="background:#e8eaf6;color:#1a237e;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600;">Step 2 of 3</span>
      <h5 class="mt-3 mb-2" style="color:#1a237e;">OTP Dalein</h5>
      <p class="text-muted mb-1" style="font-size:14px;">OTP bheja gaya hai:</p>
      <p class="mb-3"><span style="background:#e8eaf6;color:#1a237e;border-radius:20px;padding:5px 14px;font-size:13px;" th:text="${email}"></span></p>
      <div th:if="${info}"  class="alert alert-success py-2" th:text="${info}"></div>
      <div th:if="${error}" class="alert alert-danger  py-2" th:text="${error}"></div>
      <form th:action="@{/auth/verify-otp}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="email" th:value="${email}"/>
        <div class="mb-4">
          <label class="form-label fw-semibold">6-Digit OTP</label>
          <input type="text" name="otp" class="form-control form-control-lg otp-input"
                 placeholder="••••••" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autofocus/>
          <div class="mt-2 text-center" style="font-size:13px;color:#666;">
            ⏰ Expires in: <span id="timer" style="font-weight:700;color:#c62828;">10:00</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">OTP Verify Karein →</button>
      </form>
      <div class="mt-3 text-center" style="font-size:13px;">
        OTP nahi mila? <a th:href="@{/auth/forgot-password}" style="color:#1a237e;font-weight:600;">Dobara bhejein</a>
      </div>
      <hr class="my-3"/>
      <p class="text-center mb-0" style="font-size:14px;">
        <a th:href="@{/auth/login}" style="color:#1a237e;">← Wapas Login par jayein</a>
      </p>
    </div>
  </div>
</div>
<script>
  let s = 600;
  const el = document.getElementById('timer');
  const t = setInterval(() => {
    s--;
    el.textContent = Math.floor(s/60).toString().padStart(2,'0') + ':' + (s%60).toString().padStart(2,'0');
    if (s <= 0) { clearInterval(t); el.textContent = 'Expired!'; }
    if (s <= 60) el.style.color = '#c62828';
  }, 1000);
</script>
</body>
</html>
