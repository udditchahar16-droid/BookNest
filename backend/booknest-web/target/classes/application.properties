server.port=8080
spring.application.name=booknest-web

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Back-end microservice base URLs ───────────────────────────────────────────
# Change these if your services run on different hosts / ports
service.auth.url=http://localhost:8081
service.book.url=http://localhost:8082
service.cart.url=http://localhost:8083
service.order.url=http://localhost:8084
service.wallet.url=http://localhost:8085
service.review.url=http://localhost:8086
service.notification.url=http://localhost:8087
service.wishlist.url=http://localhost:8088

# ── Spring Security (basic config; real auth goes through auth-service JWT) ───
# Permit-all is configured in SecurityConfig — do NOT set a default password here
spring.security.user.name=ignored
spring.security.user.password=ignored

# ── GitHub OAuth2 (fill in your own values from GitHub Developer Settings) ────
# spring.security.oauth2.client.registration.github.client-id=YOUR_CLIENT_ID
# spring.security.oauth2.client.registration.github.client-secret=YOUR_CLIENT_SECRET
# spring.security.oauth2.client.registration.github.scope=read:user,user:email

# ── Session ───────────────────────────────────────────────────────────────────
server.servlet.session.timeout=1800s
