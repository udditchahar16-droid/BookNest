<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot Password — BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-header { background: linear-gradient(135deg, #1a237e, #283593); border-radius: 16px 16px 0 0; padding: 24px; text-align: center; }
        .btn-primary { background: #1a237e; border-color: #1a237e; }
        .form-control:focus { border-color: #1a237e; box-shadow: 0 0 0 0.2rem rgba(26,35,126,.25); }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;padding:24px 0;">
  <div class="card" style="width:420px;">
    <div class="brand-header">
      <h1 style="color:#fff;margin:0;font-size:26px;">📚 BookNest</h1>
      <p style="color:rgba(255,255,255,0.8);margin:6px 0 0;font-size:13px;">Password Reset</p>
    </div>
    <div class="card-body p-4">
      <span style="background:#e8eaf6;color:#1a237e;border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600;">Step 1 of 3</span>
      <h5 class="mt-3 mb-2" style="color:#1a237e;">Email Verify Karein</h5>
      <p class="text-muted" style="font-size:14px;">Apna registered email dalein. Hum aapko 6-digit OTP bhejenge.</p>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
      <form th:action="@{/auth/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-4">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control form-control-lg" placeholder="aapka@email.com" required autofocus/>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">OTP Bhejein →</button>
      </form>
      <hr class="my-3"/>
      <p class="text-center mb-0" style="font-size:14px;">
        <a th:href="@{/auth/login}" style="color:#1a237e;">← Wapas Login par jayein</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
