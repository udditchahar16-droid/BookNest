<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login — BookNest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-header { background: linear-gradient(135deg, #1a237e, #283593); border-radius: 16px 16px 0 0; padding: 28px; text-align: center; }
        .btn-primary { background: #1a237e; border-color: #1a237e; }
        .btn-primary:hover { background: #283593; border-color: #283593; }
        .form-control:focus { border-color: #1a237e; box-shadow: 0 0 0 0.2rem rgba(26,35,126,.25); }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;padding:24px 0;">
  <div class="card" style="width:420px;">
    <div class="brand-header">
      <h1 style="color:#fff;margin:0;font-size:28px;">📚 BookNest</h1>
      <p style="color:rgba(255,255,255,0.8);margin:6px 0 0;font-size:14px;">Your favourite book store</p>
    </div>
    <div class="card-body p-4">
      <h5 class="mb-4 text-center" style="color:#1a237e;">Sign In</h5>
      <div th:if="${info}"  class="alert alert-success py-2" th:text="${info}"></div>
      <div th:if="${error}" class="alert alert-danger  py-2" th:text="${error}"></div>
      <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="aapka@email.com" required autofocus/>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
        <div class="mb-3 text-end">
          <a th:href="@{/auth/forgot-password}" style="color:#1a237e;font-size:14px;text-decoration:none;">🔑 Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login →</button>
      </form>
      <hr class="my-3"/>
      <p class="text-center mb-0" style="font-size:14px;color:#666;">
        Account nahi hai? <a th:href="@{/auth/register}" style="color:#1a237e;font-weight:600;">Register here</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
