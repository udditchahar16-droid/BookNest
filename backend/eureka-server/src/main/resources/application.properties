server.port=8761
spring.application.name=eureka-server

# ── Eureka Server Configuration ──────────────────────────────────────────────
# This is the registry itself, so it should NOT register with itself or
# try to fetch its own registry. Both flags are set to false.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Dashboard / homepage URL shown in the Eureka UI
eureka.instance.hostname=localhost
eureka.server.enable-self-preservation=false

# Reduce eviction interval during development so dead instances are removed fast
eureka.server.eviction-interval-timer-in-ms=5000
