version: "3.9"

# ════════════════════════════════════════════════════════════════
#  BookNest — Docker Compose (RabbitMQ + Supporting Services)
#  Run: docker-compose up -d
# ════════════════════════════════════════════════════════════════

services:

  # ── RabbitMQ Message Broker ─────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: booknest-rabbitmq
    ports:
      - "5672:5672"      # AMQP port (used by Spring Boot services)
      - "15672:15672"    # Management UI → http://localhost:15672  (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL Database ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: booknest-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: booknest
      MYSQL_PASSWORD: booknest
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  mysql_data:
